<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR PDF Pro - Converta PDFs Escaneados em Documentos Editáveis</title>

    <!-- SEO -->
    <meta name="description" content="Ferramenta gratuita de OCR para PDFs que preserva formulários e campos preenchíveis. Rápido, privado e sem instalação.">
    <meta name="keywords" content="ocr, pdf, formulário, tesseract, converter pdf, ocr gratis">

    <!-- Open Graph -->
    <meta property="og:title" content="OCR PDF Pro - Preserva Formulários">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Converta PDFs escaneados mantendo campos editáveis">
    <meta property="og:image" content="/og-image.png">

    <!-- Schema.org para SEO -->
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "OCR PDF Pro",
          "operatingSystem": "Web",
          "applicationCategory": "ProductivityApplication",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Enterprise font and base theme -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --brand: #0b2948; /* deep navy */
        --accent: #0b8a9e; /* muted teal */
        --muted: #f0f4f9; /* light slate */
        --surface: #ffffff;
        --text: #0f1724;
        --muted-2: #e6eef6;
      }
      html,body,#root{height:100%;}
      body{font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--muted); color:var(--text);} 
      /* enterprise header: subtle shadow and border */
      header.bg-white{background:var(--surface); border-bottom:1px solid rgba(11,41,72,0.06);}
      /* upload zone surface */
      .upload-zone{background:linear-gradient(180deg,var(--muted) 0%, var(--muted-2) 100%); border:1px solid rgba(11,41,72,0.06);} 
      /* accent for svg icons */
      .accent-emoji{color:var(--brand);} 
      /* enterprise buttons (optional) */
      .btn-enterprise{background:var(--brand); color:white; padding:0.75rem 1.25rem; border-radius:0.75rem;}
      .btn-outline-enterprise{border:1px solid rgba(11,41,72,0.08); color:var(--brand); padding:0.5rem 1rem; border-radius:0.5rem;}
    </style>
</head>
<body class=" min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
