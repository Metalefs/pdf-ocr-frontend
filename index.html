    <!-- Canonical + OG URL:
         - Set VITE_PUBLIC_SITE_URL in your deployment (e.g. https://app.example.com)
         - Falls back to the current browser origin in dev
    -->
    <script type="module">
      try {
        const configured = (import.meta.env && import.meta.env.VITE_PUBLIC_SITE_URL)
          ? String(import.meta.env.VITE_PUBLIC_SITE_URL)
          : '';
        const origin = configured && /^https?:\/\//i.test(configured)
          ? configured.replace(/\/$/, '')
          : window.location.origin;
        const canonicalUrl = origin + window.location.pathname;
        const canonicalEl = document.querySelector('link[rel="canonical"]');
        if (canonicalEl) canonicalEl.setAttribute('href', canonicalUrl);
        const ogUrlEl = document.querySelector('meta[property="og:url"]');
        if (ogUrlEl) ogUrlEl.setAttribute('content', canonicalUrl);
      } catch {
        // ignore
      }
    </script>
