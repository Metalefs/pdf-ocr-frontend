<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b2948" />
      <stop offset="1" stop-color="#0b8a9e" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="70" y="88" width="1060" height="454" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22"/>

  <text x="120" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    TextLayer OCR
  </text>
  <text x="120" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e8f4f7">
