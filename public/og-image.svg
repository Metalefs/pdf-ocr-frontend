  </text>

  <text x="120" y="350" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#e8f4f7" opacity="0.95">
    Visualização consistente em pdf.js, PDFium e Adobe Reader
  </text>
  <text x="120" y="392" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#e8f4f7" opacity="0.95">
    Plataforma + API para automação e processamento em lote
  </text>

  <text x="120" y="490" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.8">
